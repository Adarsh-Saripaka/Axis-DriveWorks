services:
  # Backend Node.js Web Service
  - type: web
    name: axis-driveworks-backend
    runtime: node
    plan: free
    rootDir: axisdriveworks-backend
    buildCommand: npm install && node scripts/seedCarNames.js
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://axis-driveworks-frontend.onrender.com

  # Frontend Static Site
  - type: web
    name: axis-driveworks-frontend
    runtime: static
    rootDir: axisdriveworks
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://axis-driveworks-backend.onrender.com
